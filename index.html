<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e14">
<meta name="apple-mobile-web-app-title" content="Молодежь DJ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Молодежь DJ календарь</title>
<style>
  :root {
    --bg: #0e0e14;
    --panel: #171722;
    --panel2: #1f1f2e;
    --line: #2b2b3d;
    --text: #ececf3;
    --muted: #8d8da6;
    --accent: #f97316;
    --accent-soft: rgba(249,115,22,.14);
    --on-accent: #1a0a00;
    --green: #22c55e;
    /* Зелёный — «свободен»: отмеченные дни, слоты и время у админа */
    --free: #22c55e;
    --free-soft: rgba(34,197,94,.14);
    --on-free: #04140a;
    --danger: #ef4444;
    --radius: 14px;
    --soft-accent: #fdba74;
    --statusbar: var(--bg);
    /* Отступы под вырез iPhone и кнопки Telegram (переменные --tg-* выставляет сам Telegram) */
    --top-inset: max(env(safe-area-inset-top), var(--tg-safe-area-inset-top, 0px));
    --top-controls: var(--tg-content-safe-area-inset-top, 0px);
    --bottom-inset: calc(max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px)) + var(--tg-content-safe-area-inset-bottom, 0px));
  }
  :root[data-theme="light"] {
    --bg: #f4f4f8;
    --panel: #ffffff;
    --panel2: #ececf3;
    --line: #d9d9e3;
    --text: #17171f;
    --muted: #6a6a7e;
    --accent: #ea580c;
    --accent-soft: rgba(234,88,12,.12);
    --on-accent: #ffffff;
    --green: #16a34a;
    --free: #16a34a;
    --free-soft: rgba(22,163,74,.12);
    --on-free: #ffffff;
    --danger: #dc2626;
    --soft-accent: #ea580c;
    --statusbar: #ea580c; /* на iPhone текст статус-бара белый, на светлом фоне его не видно */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(88px + var(--bottom-inset)); }
  body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: var(--top-inset); background: var(--statusbar); z-index: 15; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  header { padding: calc(14px + var(--top-inset) + var(--top-controls)) 16px 8px; display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 0 16px; overflow-x: clip; }

  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .5; }
  .icon-btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center; }
  .admin-btn { height: 38px; padding: 0 12px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent);
    color: var(--accent); font-weight: 700; font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 14px 0; }
  .status { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .status.ok { color: var(--green); }
  .status.err { color: var(--danger); }

  /* Календарь */
  .cal-head { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; }
  .cal-head h2 { flex: 1; text-align: center; margin: 0; font-size: 18px; text-transform: capitalize; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .swipe { touch-action: pan-y; }
  .wd { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
  .wd.we { color: var(--soft-accent); }
  .cell { min-height: 74px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px;
    display: flex; flex-direction: column; gap: 2px; overflow: hidden; text-align: left; }
  .cell.other { opacity: .35; }
  .cell.today { border-color: var(--accent); }
  .cell.has { background: var(--free-soft); border-color: var(--free); }
  .cell .num { font-size: 13px; font-weight: 600; }
  .cell.today .num { color: var(--accent); }
  .slot-tag { font-size: 9.5px; line-height: 1.3; background: var(--free); color: var(--on-free); border-radius: 4px;
    padding: 1px 1px; white-space: nowrap; overflow: hidden; text-align: center; letter-spacing: -.3px; font-weight: 700; }
  .cell.busy { background: rgba(239,68,68,.10); border-color: var(--danger); }
  .busy-tag { font-size: 9.5px; line-height: 1.3; background: var(--danger); color: #fff; border-radius: 4px;
    padding: 1px 1px; text-align: center; font-weight: 700; }
  .busy-toggle { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 12px; border-radius: 12px;
    background: var(--panel2); border: 1px dashed var(--danger); color: var(--danger); font-size: 16px; font-weight: 700; text-align: left; }
  .busy-toggle.on { background: var(--danger); border-style: solid; color: #fff; }
  .slot-btn:disabled { opacity: .35; }
  .sets-list .t.busy, .slot-line .n.busy { color: var(--danger); }
  .count-tag { margin-top: auto; font-size: 11px; font-weight: 700; color: var(--free); }
  @media (min-width: 600px) { .cell { min-height: 92px; } .slot-tag { font-size: 12px; } }
  @keyframes slideNext { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes slidePrev { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  .slide-next { animation: slideNext .22s ease-out; }
  .slide-prev { animation: slidePrev .22s ease-out; }
  @media (prefers-reduced-motion: reduce) { .slide-next, .slide-prev { animation: none; } }

  /* Списки */
  .sets-list { margin: 0; padding: 0; list-style: none; }
  .sets-list li { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .sets-list li[data-date] { cursor: pointer; }
  .sets-list li:last-child { border-bottom: 0; }
  .sets-list .d { min-width: 118px; font-weight: 600; }
  .sets-list .t { color: var(--free); flex: 1; }
  .sets-list li.past { opacity: .5; }
  .dj-name { font-weight: 700; font-size: 16px; }
  .empty { text-align: center; color: var(--muted); padding: 18px 0; }
  .slot-line { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .slot-line:last-child { border-bottom: 0; }
  .slot-line .s { min-width: 104px; font-weight: 700; }
  .slot-line .n { flex: 1; color: var(--free); }
  .slot-line .n.none { color: var(--muted); }

  /* Окна */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: 100%; max-width: 560px;
    max-height: 92vh; overflow-y: auto; padding: 18px 16px calc(18px + var(--bottom-inset)); }
  @media (min-width: 600px) { .overlay { align-items: center; } .modal { border-radius: 18px; } }
  .modal h3 { margin: 0 0 4px; font-size: 18px; }
  label.f { display: block; margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  input[type=text], input[type=date] { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 42px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px; font-size: 13px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .tools { margin-top: 12px; }
  .period-btn { flex: 1; padding: 12px 8px; font-size: 15px; font-weight: 600; }
  .cell { position: relative; }
  .cell.picked { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pick-mark { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
    color: var(--on-accent); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .select-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + var(--bottom-inset)); display: none; box-shadow: 0 -8px 24px rgba(0,0,0,.25); }
  .select-bar.open { display: block; }
  .select-bar .inner { max-width: 760px; margin: 0 auto; }
  .select-bar .btn { flex: 1; padding: 12px 8px; font-weight: 600; }
  .btn.danger-fill { background: var(--danger); border-color: var(--danger); color: #fff; }
  body.selecting { padding-bottom: calc(200px + var(--bottom-inset)); }

  /* Нижние вкладки */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--panel);
    border-top: 1px solid var(--line); padding-bottom: var(--bottom-inset); }
  nav.tabs button { flex: 1; background: none; border: 0; padding: 10px 4px 12px; color: var(--muted); font-size: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.active { color: var(--accent); }

  /* Расписание */
  .sched-day { padding: 10px 0 4px; border-bottom: 1px solid var(--line); }
  .sched-day:last-child { border-bottom: 0; }
  .sched-day.past { opacity: .5; }
  .sched-day .d { font-weight: 700; margin-bottom: 4px; }
  .sched-row { display: flex; gap: 10px; align-items: center; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; }
  .sched-row .s { min-width: 104px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sched-row .n { flex: 1; }
  .sched-row.mine { background: var(--free-soft); box-shadow: inset 3px 0 0 var(--free); }
  .sched-row.mine .s, .sched-row.mine .n { color: var(--free); font-weight: 700; }
  .me-tag { font-size: 11px; font-weight: 800; background: var(--free); color: var(--on-free); border-radius: 999px; padding: 1px 7px; }
  .warn-tag { font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  textarea { width: 100%; min-height: 220px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: inherit; resize: vertical; }
  .example { background: var(--panel2); border-radius: 10px; padding: 8px 10px; font: 12.5px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre; overflow-x: auto; margin: 6px 0 0; }
  .err-line { font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .err-line:last-child { border-bottom: 0; }
  .slot-btn { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 8px; border-radius: 12px;
    background: var(--panel2); border: 1px solid var(--line); font-size: 17px; font-weight: 600; text-align: left; }
  .slot-btn .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); flex: none;
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px; color: transparent; }
  .slot-btn.on { background: var(--free-soft); border-color: var(--free); }
  .slot-btn.on .box { background: var(--free); border-color: var(--free); color: var(--on-free); }
  .seg { display: flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 8px; color: var(--muted); }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .actions .btn { flex: 1; padding: 12px; }

  .toast { position: fixed; left: 50%; bottom: calc(84px + var(--bottom-inset)); transform: translateX(-50%) translateY(20px);
    background: var(--green); color: #04140a; font-weight: 600; padding: 10px 18px; border-radius: 999px; opacity: 0;
    transition: .25s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<header>
  <h1>Молодежь <span>DJ</span> календарь</h1>
  <button class="admin-btn" id="toggleAdmin" style="display:none">Админ</button>
  <button class="icon-btn" id="openSettings" aria-label="Настройки">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <div class="cal-head">
    <button class="icon-btn" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
    <h2 id="monthTitle"></h2>
    <button class="icon-btn" id="nextMonth" aria-label="Следующий месяц">›</button>
  </div>

  <!-- Календарь диджея -->
  <section id="userView">
    <div class="grid" id="weekdays"></div>
    <div class="grid swipe" id="calendar"></div>
    <div class="row tools">
      <button class="btn period-btn" id="startSelect">Выбрать дни</button>
      <button class="btn period-btn" id="openPeriod">Отметить период</button>
    </div>
    <div class="card swipe" id="setsCard">
      <div class="row" style="margin-bottom:6px">
        <b class="spacer" id="setsTitle"></b>
        <button class="btn primary small" id="copySets">Скопировать</button>
      </div>
      <div id="setsList"></div>
      <div class="status" id="serverStatus"></div>
    </div>
  </section>

  <!-- Админ-панель -->
  <section id="adminView" style="display:none">
    <div class="row" style="margin-bottom:10px">
      <div class="seg spacer" id="adminMode">
        <button data-v="dates">По датам</button>
        <button data-v="djs">По диджеям</button>
      </div>
      <button class="icon-btn" id="adminRefresh" aria-label="Обновить">↻</button>
    </div>
    <button class="btn primary" id="adminCopyAll" style="width:100%;margin-bottom:8px;padding:11px"></button>
    <button class="btn" id="adminSchedule" style="width:100%;margin-bottom:12px;padding:11px;font-weight:600">Создать расписание</button>
    <div id="adminDates">
      <div class="grid" id="adminWeekdays"></div>
      <div class="grid swipe" id="adminCalendar"></div>
    </div>
    <div class="swipe" id="adminDjs"></div>
    <div class="status" id="adminStatus"></div>
  </section>

  <!-- Расписание для всех диджеев -->
  <section id="schedView" style="display:none">
    <div class="card swipe" id="schedCard">
      <div class="row" style="margin-bottom:6px">
        <b class="spacer" id="schedTitle"></b>
        <button class="icon-btn" id="schedRefresh" aria-label="Обновить">↻</button>
      </div>
      <div class="muted" id="schedMine" style="font-size:13px;margin-bottom:4px"></div>
      <div id="schedList"></div>
      <div class="status" id="schedStatus"></div>
    </div>
  </section>
</main>

<nav class="tabs" id="tabs">
  <button class="active" data-tab="cal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Календарь
  </button>
  <button data-tab="sched">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    Расписание
  </button>
</nav>

<div class="select-bar" id="selectBar">
  <div class="inner">
    <div class="row"><b class="spacer" id="selCount"></b><button class="btn small" id="selCancel">Отмена</button></div>
    <div class="muted" style="font-size:13px;margin:4px 0 10px">Нажимай на дни в календаре, затем выбери действие</div>
    <div class="row">
      <button class="btn danger-fill" id="selBusy">Занят весь день</button>
      <button class="btn primary" id="selFree">Свободен</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="selClear">Снять все отметки</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// Адрес хранилища (Google Apps Script → Развернуть → Веб-приложение). Пусто — данные никуда не отправляются.
const SERVER_URL = 'https://script.google.com/macros/s/AKfycbyHNIADT2fl7lYc6dJJAOHifzPsmRS4jvQjvISssN3wibmlWAn0DDsRP8XV8CnQ7h-p/exec';

const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_PREP = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const WD_SHORT = ['вс','пн','вт','ср','чт','пт','сб'];
const WD_LONG = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

// Слоты клуба. Время до утра относится к дате вечера, с которого начинается ночь.
const WEEKDAY_SLOTS = ['21:00–00:00', '00:00–03:00', '03:00–06:00'];
const WEEKEND_SLOTS = ['20:00–22:00', '22:00–00:00', '00:00–02:00', '02:00–04:00', '04:00–06:00', '06:00–09:00'];

// ---------- Данные ----------
const tg = window.Telegram && window.Telegram.WebApp;
const TG = (() => {
  try { return tg.initDataUnsafe.user || null; } catch (e) { return null; }
})();
// Внутри Telegram копия данных на устройстве хранится отдельно для каждого аккаунта,
// иначе два аккаунта на одном телефоне видели бы один календарь
const TG_USER = TG && TG.id ? String(TG.id) : '';
const TG_NAME = TG ? [TG.first_name, TG.last_name].filter(Boolean).join(' ') : '';
const STORAGE_KEY = TG_USER ? `mdjcal.v1.tg${TG_USER}` : 'mdjcal.v1';

// sets — свободные слоты по датам, busy — даты, когда диджей занят весь день
const defaultState = () => ({ sets: {}, busy: {}, settings: {} });

// Проверяет и дополняет данные; повреждённые данные — null
function normalize(data) {
  if (data && data.sets && typeof data.sets === 'object') return { ...data, busy: { ...data.busy }, settings: { ...data.settings } };
  return null;
}

function load() {
  try {
    const data = normalize(JSON.parse(localStorage.getItem(STORAGE_KEY)));
    if (data) return data;
  } catch (e) {}
  return defaultState();
}

let state = load();

function storeLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function save() {
  state.updatedAt = Date.now();
  storeLocal();
  renderAll();
  cloudPushSoon();
  serverPushSoon();
}

const nick = () => (state.settings.nick || '').trim() || TG_NAME;

// ---------- Даты ----------
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const todayStr = () => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth(), t.getDate()); };
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return { y, m: m - 1, d }; };
const dayNum = s => { const { y, m, d } = parseDate(s); return Math.round(Date.UTC(y, m, d) / 86400000); };
const fromDayNum = n => { const t = new Date(n * 86400000); return ymd(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); };
const weekday = s => { const { y, m, d } = parseDate(s); return new Date(y, m, d).getDay(); };
const isWeekend = s => { const w = weekday(s); return w === 5 || w === 6; }; // пятница и суббота
const slotsFor = ds => isWeekend(ds) ? WEEKEND_SLOTS : WEEKDAY_SLOTS;
const dateShort = s => { const { m, d } = parseDate(s); return `${d} ${MONTHS_GEN[m]}, ${WD_SHORT[weekday(s)]}`; };
const dateLong = s => { const { m, d } = parseDate(s); return `${d} ${MONTHS_GEN[m]}, ${WD_LONG[weekday(s)]}`; };
const shortSlot = slot => slot.replace(/:00/g, ''); // «22:00–00:00» → «22–00»
const monthBounds = (y, m) => [ymd(y, m, 1), ymd(y, m, new Date(y, m + 1, 0).getDate())];
// Выбранные слоты даты — в том порядке, в каком они идут за ночь
const slotsOf = (sets, ds) => slotsFor(ds).filter(s => (sets[ds] || []).includes(s));
const setsOn = ds => slotsOf(state.sets, ds);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- Утилиты интерфейса ----------
const $ = id => document.getElementById(id);

function toast(text, isError) {
  const t = $('toast');
  t.textContent = text;
  t.classList.toggle('err', !!isError);
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast('Скопировано');
}

function openModal(html) {
  $('modal').innerHTML = html;
  $('overlay').classList.add('open');
}
// При закрытии окна возвращаем сохранённую тему (её можно было только примерить в настройках)
function closeModal() { $('overlay').classList.remove('open'); applyTheme(); }
$('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });

// ---------- Сетка месяца (общая для диджея и админа) ----------
const now = new Date();
let view = { y: now.getFullYear(), m: now.getMonth() };

const weekdaysHtml = ['пн','вт','ср','чт','пт','сб','вс']
  .map((w, i) => `<div class="wd ${i === 4 || i === 5 ? 'we' : ''}">${w}</div>`).join('');
$('weekdays').innerHTML = weekdaysHtml;
$('adminWeekdays').innerHTML = weekdaysHtml;

// cellInner(ds) возвращает { cls, html } для содержимого ячейки
function renderGrid(el, cellInner, onPick) {
  const shift = (new Date(view.y, view.m, 1).getDay() + 6) % 7; // понедельник — первый день
  const startN = dayNum(ymd(view.y, view.m, 1)) - shift;
  const today = todayStr();
  let html = '';
  for (let i = 0; i < 42; i++) {
    const ds = fromDayNum(startN + i);
    const { m, d } = parseDate(ds);
    if (i >= 35 && m !== view.m) break;
    const inner = cellInner(ds);
    const cls = ['cell', inner.cls];
    if (m !== view.m) cls.push('other');
    if (ds === today) cls.push('today');
    html += `<button class="${cls.join(' ')}" data-date="${ds}"><span class="num">${d}</span>${inner.html}</button>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.cell').forEach(c => c.onclick = () => onPick(c.dataset.date));
}

function renderCalendar() {
  renderGrid($('calendar'), ds => {
    const mark = selecting && picked.has(ds) ? '<span class="pick-mark">✓</span>' : '';
    const pickCls = mark ? ' picked' : '';
    if (state.busy[ds]) return { cls: 'busy' + pickCls, html: '<div class="busy-tag">занят</div>' + mark };
    const sets = setsOn(ds);
    return { cls: (sets.length ? 'has' : '') + pickCls, html: sets.map(s => `<div class="slot-tag">${shortSlot(s)}</div>`).join('') + mark };
  }, ds => selecting ? togglePick(ds) : openDay(ds));
}

// ---------- Выбор нескольких дней галочками ----------
let selecting = false;
const picked = new Set();

function setSelecting(on) {

  picked.clear();
  $('selectBar').classList.toggle('open', on);
  document.body.classList.toggle('selecting', on);

  renderSelectBar();

}

function togglePick(ds) {

}

function renderSelectBar() {

  $('selBusy').disabled = $('selFree').disabled = $('selClear').disabled = !picked.size;
}

// busy — день целиком закрыт; free — открыты все слоты; clear — без отметок
function applyPicked(mode) {
  const n = picked.size;
  picked.forEach(ds => setDay(ds, mode === 'free' ? slotsFor(ds) : [], mode === 'busy'));
  setSelecting(false);
  save();

}

$('startSelect').onclick = () => setSelecting(!selecting);
$('selCancel').onclick = () => setSelecting(false);
$('selBusy').onclick = () => applyPicked('busy');

$('selClear').onclick = () => applyPicked('clear');


// ---------- Окно дня: выбор свободного времени ----------
function openDay(ds) {
  const chosen = new Set(state.sets[ds] || []);
  let busy = !!state.busy[ds];
  openModal(`
    <h3>${dateLong(ds)}</h3>
    <div class="muted" style="font-size:13px;margin-bottom:12px">${isWeekend(ds) ? 'Выходной' : 'Будний день'} · отметь своё свободное время</div>
    <button class="busy-toggle" id="dBusy"><span>🚫</span><span>Весь день занят</span></button>
    ${slotsFor(ds).map(s => `
      <button class="slot-btn ${chosen.has(s) ? 'on' : ''}" data-slot="${s}"><span class="box">✓</span>${s}</button>`).join('')}
    <div class="actions">
      <button class="btn" id="dCancel">Отмена</button>
      <button class="btn primary" id="dSave">Сохранить</button>
    </div>`);
  // Занятый день не может быть одновременно свободным: слоты отключаются
  const drawBusy = () => {
    $('dBusy').classList.toggle('on', busy);
    $('modal').querySelectorAll('.slot-btn').forEach(b => {
      b.disabled = busy;
      b.classList.toggle('on', !busy && chosen.has(b.dataset.slot));
    });
  };
  $('dBusy').onclick = () => { busy = !busy; drawBusy(); };
  $('modal').querySelectorAll('.slot-btn').forEach(b => b.onclick = () => {
    const s = b.dataset.slot;
    chosen.has(s) ? chosen.delete(s) : chosen.add(s);
    b.classList.toggle('on', chosen.has(s));
  });
  drawBusy();
  $('dCancel').onclick = closeModal;
  $('dSave').onclick = () => {
    setDay(ds, busy ? [] : slotsFor(ds).filter(s => chosen.has(s)), busy);
    save();
    closeModal();
  };
}

// Записывает день: либо свободные слоты, либо «занят весь день», либо ничего
function setDay(ds, slots, busy) {
  if (slots.length && !busy) state.sets[ds] = slots;
  else delete state.sets[ds];
  if (busy) state.busy[ds] = true;
  else delete state.busy[ds];
}

// ---------- Моё свободное время за месяц ----------
// Свободные дни месяца; с busy — вместе с занятыми днями (у них busy: true и нет слотов)
function monthDays(sets, busy) {
  const [from, to] = monthBounds(view.y, view.m);
  const free = Object.keys(sets).filter(ds => ds >= from && ds <= to && slotsOf(sets, ds).length)
    .map(ds => ({ date: ds, slots: slotsOf(sets, ds) }));
  const off = busy ? Object.keys(busy).filter(ds => ds >= from && ds <= to && busy[ds]).map(ds => ({ date: ds, slots: [], busy: true })) : [];
  return [...free, ...off].sort((a, b) => a.date < b.date ? -1 : 1);
}

const dayText = d => d.busy ? 'занят весь день' : d.slots.join(', ');

function renderSets() {
  const days = monthDays(state.sets, state.busy);
  const freeCount = days.filter(d => !d.busy).length;
  const today = todayStr();
  $('setsTitle').textContent = `Моё свободное время — ${MONTHS[view.m]}${freeCount ? ` (${freeCount})` : ''}`;
  $('setsList').innerHTML = days.length
    ? `<ul class="sets-list">${days.map(d => `
        <li class="${d.date < today ? 'past' : ''}" data-date="${d.date}">
          <span class="d">${dateShort(d.date)}</span>
          <span class="t ${d.busy ? 'busy' : ''}">${dayText(d)}</span>
        </li>`).join('')}</ul>`
    : '<div class="empty">В этом месяце свободное время не отмечено. Нажми на день в календаре, чтобы отметить.</div>';
  $('setsList').querySelectorAll('li[data-date]').forEach(li => li.onclick = () => openDay(li.dataset.date));
  $('copySets').disabled = !freeCount;
}

$('copySets').onclick = () => {
  const days = monthDays(state.sets);
  copyText(`Моё свободное время — ${MONTHS[view.m]} ${view.y}:\n` + days.map(d => `${dateShort(d.date)} — ${d.slots.join(', ')}`).join('\n'));
};

// ---------- Отметить сразу период ----------
// «Свободен» добавляет выбранные слоты ко всем дням периода, «Занят» убирает только их —
// так можно отметить весь месяц свободным, а потом снять занятые дни
function openPeriod() {
  const [mFrom, mTo] = monthBounds(view.y, view.m);
  const today = todayStr();
  let mode = 'free';
  const picked = new Set([...WEEKDAY_SLOTS, ...WEEKEND_SLOTS]);
  const chips = (title, slots) => `
    <div class="muted" style="font-size:12px;margin:8px 0 4px">${title}</div>
    <div class="chips">${slots.map(s => `<button class="chip on" data-slot="${s}">${s}</button>`).join('')}</div>`;
  openModal(`
    <h3>Отметить сразу период</h3>
    <div class="chips" style="margin-top:10px">
      <button class="chip" data-q="month">Весь ${MONTHS[view.m]}</button>
      <button class="chip" data-q="rest">С сегодня до конца месяца</button>
    </div>
    <div class="two">
      <div><label class="f">С</label><input type="date" id="pFrom" value="${mFrom < today && today <= mTo ? today : mFrom}"></div>
      <div><label class="f">По</label><input type="date" id="pTo" value="${mTo}"></div>
    </div>
    <label class="f">Что отметить</label>
    <div class="seg" id="pMode">
      <button data-v="free">Свободен</button>
      <button data-v="off">Занят весь день</button>
      <button data-v="busy">Убрать слоты</button>
    </div>
    <div id="pSlots">
      <label class="f">Слоты</label>
      ${chips('Будни (пн–чт, вс)', WEEKDAY_SLOTS)}
      ${chips('Выходные (пт, сб)', WEEKEND_SLOTS)}
    </div>
    <div class="hint muted" id="pHint" style="font-size:13px;margin-top:12px"></div>
    <div class="actions">
      <button class="btn" id="pCancel">Отмена</button>
      <button class="btn primary" id="pApply">Применить</button>
    </div>`);
  const days = () => {
    const from = $('pFrom').value, to = $('pTo').value;
    if (!from || !to || from > to) return [];
    const res = [];
    for (let n = dayNum(from); n <= dayNum(to); n++) res.push(fromDayNum(n));
    return res;
  };
  const hint = () => {
    const n = days().length;
    $('pHint').textContent = !n ? 'Проверь даты: «с» должно быть не позже «по».'
      : mode === 'free' ? `Выбранные слоты станут свободными во всех ${n} днях периода. Уже отмеченное останется.`
      : mode === 'off' ? `Все ${n} дней периода будут отмечены «занят весь день», свободные слоты в них снимутся.`
      : `Выбранные слоты станут не свободными во всех ${n} днях периода. Остальные отметки не изменятся.`;
  };
  const setMode = v => {
    mode = v;
    $('pMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    $('pApply').textContent = v === 'free' ? 'Отметить свободным' : v === 'off' ? 'Отметить занятым' : 'Убрать слоты';
    $('pSlots').style.display = v === 'off' ? 'none' : '';
    hint();
  };
  setMode('free');
  $('pMode').querySelectorAll('button').forEach(b => b.onclick = () => setMode(b.dataset.v));
  $('modal').querySelectorAll('.chip[data-slot]').forEach(c => c.onclick = () => {
    const s = c.dataset.slot;
    picked.has(s) ? picked.delete(s) : picked.add(s);
    c.classList.toggle('on', picked.has(s));
  });
  $('modal').querySelectorAll('.chip[data-q]').forEach(c => c.onclick = () => {
    $('pFrom').value = c.dataset.q === 'rest' && mFrom <= today && today <= mTo ? today : mFrom;
    $('pTo').value = mTo;
    hint();
  });
  $('pFrom').oninput = hint;
  $('pTo').oninput = hint;
  $('pCancel').onclick = closeModal;
  $('pApply').onclick = () => {
    const list = days();
    if (!list.length) { toast('Проверь даты периода', true); return; }
    if (mode !== 'off' && !picked.size) { toast('Выбери хотя бы один слот', true); return; }
    let changed = 0;
    list.forEach(ds => {
      const before = JSON.stringify([state.sets[ds], state.busy[ds]]);
      if (mode === 'off') {
        setDay(ds, [], true);
      } else {
        const cur = new Set(state.sets[ds] || []);
        slotsFor(ds).filter(s => picked.has(s)).forEach(s => mode === 'free' ? cur.add(s) : cur.delete(s));
        // отметить свободным — значит, день больше не «занят весь день»
        setDay(ds, slotsFor(ds).filter(s => cur.has(s)), mode === 'busy' && !!state.busy[ds]);
      }
      if (JSON.stringify([state.sets[ds], state.busy[ds]]) !== before) changed++;
    });
    save();
    closeModal();
    toast(changed ? `Готово: изменено дней — ${changed}` : 'Ничего не изменилось');
  };
}
$('openPeriod').onclick = openPeriod;

// ---------- Отправка в общее хранилище ----------
// Хранилище проверяет подпись Telegram (initData), поэтому отправлять можно только из бота
const serverReady = () => !!(SERVER_URL && tg && tg.initData);
// v2: первая версия скрипта таблицы теряла слоты — после её замены все отправляют данные заново
const PUSHED_KEY = `mdjcal.pushedAt.v2.tg${TG_USER}`;
let serverState = ''; // '', 'sending', 'ok', 'error'

async function api(action, payload = {}) {
  const res = await fetch(SERVER_URL, { method: 'POST', body: JSON.stringify({ action, initData: tg.initData, ...payload }) });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'server');
  return data;
}

function renderServerStatus() {
  const el = $('serverStatus');
  el.className = 'status';
  if (!tg || !tg.initData) {
    el.textContent = 'Открой календарь через бота в Telegram, чтобы администратор видел твоё свободное время.';
  } else if (!SERVER_URL) {
    el.textContent = 'Общее хранилище ещё не подключено — администратор пока не видит твоё время.';
  } else if (serverState === 'sending') {
    el.textContent = 'Отправляю администратору…';
  } else if (serverState === 'error') {
    el.className = 'status err';
    el.textContent = 'Не удалось отправить администратору. Попробую ещё раз при следующем открытии.';
  } else if (!Object.keys(state.sets).length) {
    el.textContent = `Отмеченное свободное время сразу увидит администратор · ник: ${nick() || 'не указан'}`;
  } else if (pushedAt() >= (state.updatedAt || 0)) {
    el.className = 'status ok';
    el.textContent = `✓ Администратор видит твоё время · ник: ${nick() || 'не указан'}`;
  } else {
    el.textContent = '';
  }
}

function pushedAt() {
  try { return Number(localStorage.getItem(PUSHED_KEY)) || 0; } catch (e) { return 0; }
}

let serverTimer;
function serverPushSoon() {
  if (!serverReady()) return;
  clearTimeout(serverTimer);
  serverTimer = setTimeout(serverPush, 1200);
}

async function serverPush() {
  const stamp = state.updatedAt || 0;
  serverState = 'sending';
  renderServerStatus();
  try {
    // Админу уходит только свободное время; занятые дни остаются в личном календаре
    const res = await api('save', { nick: nick(), sets: state.sets });
    try { localStorage.setItem(PUSHED_KEY, String(stamp)); } catch (e) {}
    serverState = 'ok';
    setAdmin(res.admin);
  } catch (e) {
    serverState = 'error';
  }
  renderServerStatus();
}

// При запуске: узнаём, админ ли это, и досылаем то, что не ушло в прошлый раз
async function serverHello() {
  if (!serverReady()) return;
  if (pushedAt() < (state.updatedAt || 0)) return serverPush();
  try { setAdmin((await api('hello')).admin); } catch (e) {}
}

// Свайп влево — следующий месяц, вправо — предыдущий; на Mac — жест двумя пальцами по трекпаду
function attachSwipe(el) {
  let x0 = null, y0 = 0;
  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener('touchend', e => {
    if (x0 === null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1);
  });
  let acc = 0, lock = 0;
  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    // пока идёт инерция одного жеста, второй раз не листаем
    if (Date.now() < lock) { lock = Date.now() + 300; return; }
    acc += e.deltaX;
    if (Math.abs(acc) > 80) { move(acc > 0 ? 1 : -1); acc = 0; lock = Date.now() + 300; }
  }, { passive: false });
}

// ---------- Создание расписания (админ) ----------
const MONTH_KEYS = ['январ', 'феврал', 'март', 'апрел', 'ма', 'июн', 'июл', 'август', 'сентябр', 'октябр', 'ноябр', 'декабр'];
const MONTH_DATE_RE = /(\d{1,2})\s+(январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр)[а-яё]*/i;
const NUM_DATE_RE = /(^|[^\d])(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?!\d)/;
const TIME_RE = /(\d{1,2})[:.](\d{2})\s*[-–—−]\s*(\d{1,2})[:.](\d{2})/;
const WEEKDAY_RE = /(^|[^а-яёa-z])(понедельник|вторник|среда|среду|четверг|пятница|пятницу|суббота|субботу|воскресенье|пн|вт|ср|чт|пт|сб|вс)(?=[^а-яёa-z]|$)/gi;
const EDGE_RE = /^[\s,.:;|—–−-]+|[\s,.:;|—–−-]+$/g;

// Год не пишут — берём тот, при котором дата ближе всего к месяцу на экране
function guessYear(m) {
  if (m - view.m > 6) return view.y - 1;
  if (view.m - m > 6) return view.y + 1;
  return view.y;
}

function validDate(y, m, d) {
  const t = new Date(y, m, d);
  return t.getFullYear() === y && t.getMonth() === m && t.getDate() === d ? ymd(y, m, d) : '';
}

// Ищет дату «14 ноября» или «14.11(.2026)»; возвращает дату и строку без неё
function findDate(line) {
  let m = line.match(MONTH_DATE_RE);
  if (m) {
    const mi = MONTH_KEYS.findIndex(k => m[2].toLowerCase().startsWith(k));
    const ds = validDate(guessYear(mi), mi, Number(m[1]));
    if (ds) return { ds, rest: line.replace(m[0], ' ') };
  }
  m = line.match(NUM_DATE_RE);
  if (m) {
    const mi = Number(m[3]) - 1;
    const y = m[4] ? (m[4].length === 2 ? 2000 + Number(m[4]) : Number(m[4])) : guessYear(mi);
    const ds = mi >= 0 && mi < 12 ? validDate(y, mi, Number(m[2])) : '';
    if (ds) return { ds, rest: line.replace(m[0], m[1] + ' ') };
  }
  return null;
}

function matchDj(text) {
  const n = normNick(text);
  return (adminData || []).find(dj => [dj.nick, dj.tgName, dj.username].some(v => v && normNick(v) === n)) || null;
}

// Понимает «дата, под ней строки „время — ник“» и «дата время ник» в одной строке
function parseSchedule(text) {
  const entries = [], dates = new Set(), errors = [];
  let cur = null;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    let rest = line, time = '';
    const t = rest.match(TIME_RE);
    if (t) {
      time = `${pad(t[1])}:${t[2]}–${pad(t[3])}:${t[4]}`;
      rest = rest.replace(t[0], ' ');
    }
    const d = findDate(rest);
    if (d) { rest = d.rest; cur = d.ds; dates.add(d.ds); }
    rest = rest.replace(WEEKDAY_RE, '$1').replace(EDGE_RE, '').trim();
    if (!time) {
      if (d && !rest) return;               // строка-дата
      if (/:\s*$/.test(line)) return;       // заголовок вроде «Свободные слоты — ноябрь 2026:»
      errors.push({ line, why: d ? 'нет времени' : 'не понял строку' });
      return;
    }
    if (!cur) { errors.push({ line, why: 'не указана дата' }); return; }
    if (/^никого$/i.test(rest)) return;      // строка из «Скопировать всё», где никто не свободен
    if (!rest) { errors.push({ line, why: 'нет ника' }); return; }
    rest.split(/\s*,\s*/).filter(Boolean).forEach(nk => {
      const dj = matchDj(nk);
      entries.push({ date: cur, time, nick: dj ? (dj.nick || dj.tgName || nk) : nk, id: dj ? dj.id : '', matched: !!dj });
    });
  });
  return { entries, dates: [...dates].sort(), errors };
}

// ---------- Синхронизация через Telegram ----------
// Внутри Telegram данные хранятся ещё и в облаке Telegram (CloudStorage), поэтому календарь
// одинаковый на всех устройствах одного аккаунта. В одном ключе — не больше 4096 символов,
// поэтому данные режутся на куски. Каждая запись идёт под новым «поколением» ключей,
// а мета-ключ переключается на него в самом конце: недописанная запись не портит облако.
const cloud = tg && tg.initData && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
const CLOUD_META = 'mdj_meta';
const CLOUD_CHUNK = 4000;
const SYNCED_KEY = `mdjcal.cloudSynced.tg${TG_USER}`;

const cloudCall = (method, ...args) => new Promise((resolve, reject) =>
  cloud[method](...args, (err, res) => err ? reject(err) : resolve(res)));
const chunkKeys = meta => Array.from({ length: meta.n }, (_, i) => `mdj_${meta.gen}_${i}`);

async function cloudReadMeta() {
  return JSON.parse(await cloudCall('getItem', CLOUD_META) || 'null');
}

async function cloudRead() {
  const meta = await cloudReadMeta();
  if (!meta) return null;
  const keys = chunkKeys(meta);
  const parts = await cloudCall('getItems', keys);
  const data = normalize(JSON.parse(keys.map(k => parts[k] || '').join('')));
  if (!data) throw new Error('broken cloud data');
  return { meta, data };
}

async function cloudWrite() {
  const prev = await cloudReadMeta();
  const json = JSON.stringify(state);
  const meta = { gen: Date.now().toString(36), n: Math.max(1, Math.ceil(json.length / CLOUD_CHUNK)), updatedAt: state.updatedAt || 0 };
  const keys = chunkKeys(meta);
  for (let i = 0; i < keys.length; i++) await cloudCall('setItem', keys[i], json.slice(i * CLOUD_CHUNK, (i + 1) * CLOUD_CHUNK));
  await cloudCall('setItem', CLOUD_META, JSON.stringify(meta));
  if (prev && prev.gen !== meta.gen) await cloudCall('removeItems', chunkKeys(prev)).catch(() => {});
}

// Записи в облако идут строго по очереди
let cloudQueue = Promise.resolve();
let cloudTimer;
function cloudPushSoon() {
  if (!cloud) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => {
    cloudQueue = cloudQueue.then(cloudWrite).catch(() => toast('Не удалось сохранить в облако Telegram', true));
  }, 800);
}

// Первая синхронизация на устройстве объединяет его данные с облаком, чтобы ничего не потерять
function mergeStates(a, b) {
  const [newer, older] = (a.updatedAt || 0) >= (b.updatedAt || 0) ? [a, b] : [b, a];
  const res = JSON.parse(JSON.stringify(newer));
  res.busy = res.busy || {};
  for (const ds in older.sets) {
    if (res.busy[ds]) continue;
    const all = new Set([...(res.sets[ds] || []), ...older.sets[ds]]);
    res.sets[ds] = slotsFor(ds).filter(s => all.has(s));
  }
  for (const ds in older.busy || {}) if (older.busy[ds] && !res.sets[ds]) res.busy[ds] = true;
  if (!res.settings.nick && older.settings && older.settings.nick) res.settings.nick = older.settings.nick;
  return res;
}

// Потом — побеждает более свежая версия
async function cloudPull() {
  if (!cloud) return;
  let remote;
  try { remote = await cloudRead(); } catch (e) { return; } // облако недоступно — работаем с тем, что есть
  let synced = false;
  try { synced = localStorage.getItem(SYNCED_KEY) === '1'; } catch (e) {}
  const localTime = state.updatedAt || 0;
  if (!remote) {
    cloudPushSoon();
  } else if (!synced) {
    state = mergeStates(state, remote.data);
    applyTheme();
    save();
  } else if ((remote.meta.updatedAt || 0) > localTime) {
    state = remote.data;
    storeLocal();
    applyTheme();
    renderAll();
  } else if (localTime > (remote.meta.updatedAt || 0)) {
    cloudPushSoon();
  }
  try { localStorage.setItem(SYNCED_KEY, '1'); } catch (e) {}
}

applyTheme();
setAdmin(isAdminUser);
renderAll();

if (tg) {
  tg.ready();
  tg.expand();
  // Старые версии Telegram в полноэкранном режиме не сообщают, сколько места занимают их кнопки
  const fixControls = () => {
    const reported = tg.contentSafeAreaInset && tg.contentSafeAreaInset.top;
    const mobile = tg.platform === 'ios' || tg.platform === 'android';
    document.documentElement.style.setProperty('--top-controls', tg.isFullscreen && mobile && !reported ? '46px' : 'var(--tg-content-safe-area-inset-top, 0px)');
  };
  fixControls();
  if (tg.onEvent) ['fullscreenChanged', 'contentSafeAreaChanged', 'safeAreaChanged'].forEach(ev => tg.onEvent(ev, fixControls));
}
cloudPull().then(serverHello).then(() => { if (tab === 'sched') loadSchedule(); });
// Вернулись в приложение (например, после правок на другом устройстве) — подтягиваем свежие данные
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  cloudPull().then(serverHello);
  if (adminOpen) loadAdmin();
  if (tab === 'sched') loadSchedule();
});

// Установка на экран «Домой»: офлайн-режим и просьба не удалять данные
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
